name: Feature request
description: Suggest a new setting, a better range or a new option
labels: [enhancement, triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: input
    id: cvars
    attributes:
      label: Which CVar(s)?
      placeholder: "groundEffectDist, cameraDistanceMaxZoomFactor..."
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: The situation where you'd use it.
  - type: textarea
    id: other
    attributes:
      label: Anything else
