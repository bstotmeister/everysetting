name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The game runs Lua 5.1. The tests load the addon's files with a stand-in
      # for the game's API (tests/wow.lua).
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Run tests
        run: lua5.1 tests/run.lua
