<!doctype html>
<!-- The brand card. scripts/brand.sh renders it twice: 1280x640 for GitHub's social
     preview (social.png) and, with ?banner, 1280x360 for the README (banner.png). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Every Setting</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@700&amp;display=swap" rel="stylesheet">
<style>
html, body { margin: 0; height: 100%; }
body {
	box-sizing: border-box; padding: 0 88px; display: flex; align-items: center; gap: 72px;
	background: #0E0E11; color: #F2EDE4; font-family: "Barlow", system-ui, sans-serif;
}
img { width: 300px; height: 300px; flex: none; }
.text { display: flex; flex-direction: column; gap: 18px; }
.label { font-size: 18px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #A3A3AD; }
h1 { margin: 0; font-family: "Barlow Condensed", "Barlow", sans-serif; font-weight: 700; font-size: 136px; line-height: 0.95; white-space: nowrap; }
h1 span { color: #FFB000; }
.tagline { margin: 0; font-size: 38px; font-weight: 500; line-height: 1.2; }
.tagline span, .summary { color: #A3A3AD; }
.summary { margin: 0; font-size: 22px; line-height: 1.45; max-width: 640px; }
/* The README banner: shorter, without the label and the summary. */
.banner img { width: 220px; height: 220px; }
.banner h1 { font-size: 112px; }
.banner .tagline { font-size: 32px; }
.banner .label, .banner .summary { display: none; }
</style>
</head>
<body>
<img src="logo.svg" alt="">
<div class="text">
<div class="label">Built for WoW Forever</div>
<h1>Every <span>Setting</span></h1>
<p class="tagline">Set once, kept forever.<br><span>Even the hidden ones.</span></p>
<p class="summary">Every WoW Forever setting in one window, hidden ones included: real ranges for the ones worth tuning, and your values set again at every login.</p>
</div>
<script>if (location.search === "?banner") document.body.className = "banner";</script>
</body>
</html>
